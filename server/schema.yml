openapi: 3.0.3
info:
  title: Expense Tracker API
  version: 1.0.0
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Email + password login. Returns the short-lived access token; the
        refresh token is set as a scoped httpOnly cookie (never in the body).
      summary: Login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist the refresh token (cookie or body) and clear the refresh
        cookie. The access token expires on its own (15m).
      summary: Logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Return the authenticated user profile. Never lists other users.
      summary: My profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Rotate the refresh token. Read from the httpOnly cookie first,
        legacy JSON body second (deprecated); returns the new access token and rotates
        the cookie.
      summary: Refresh
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessResponse'
          description: ''
  /api/budgets/:
    get:
      operationId: budgets_list
      description: Owner-scoped, ordered by (month, id). Includes computed `spent`/`remaining`/`is_over`
        derived from committed expenses.
      summary: List my budgets
      parameters:
      - in: query
        name: category_id
        schema:
          type: integer
        description: Filter by budget scope category id.
      - in: query
        name: month
        schema:
          type: string
        description: Calendar month `YYYY-MM`; bad month returns 400.
      tags:
      - budgets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
          description: ''
    post:
      operationId: budgets_create
      description: '`month` takes `YYYY-MM`; `category: null` is the overall budget;
        a set category must be an owned expense category. Duplicate (user, month,
        category) returns 400.'
      summary: Create a monthly budget
      tags:
      - budgets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Budget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Budget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Budget'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/budgets/{id}/:
    get:
      operationId: budgets_retrieve
      description: User-owned budget CRUD + derived spend (B2/B3).
      summary: Retrieve my budget
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Budget id.
        required: true
      tags:
      - budgets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
    patch:
      operationId: budgets_partial_update
      description: PATCH only. Re-checks scope uniqueness and the expense-only rule.
      summary: Partially update my budget
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Budget id.
        required: true
      tags:
      - budgets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBudget'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBudget'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBudget'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
    delete:
      operationId: budgets_destroy
      description: 204; never deletes historical transactions.
      summary: Delete my budget
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Budget id.
        required: true
      tags:
      - budgets
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/categories/:
    get:
      operationId: categories_list
      description: Owner-scoped, ordered by (name, id). Optional `type` filter.
      summary: List my categories
      parameters:
      - in: query
        name: type
        schema:
          type: string
          enum:
          - expense
          - income
        description: Filter by category type.
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
    post:
      operationId: categories_create
      description: Owner set from the JWT. 201 on success.
      summary: Create a category
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      description: User-owned category CRUD with `?type=` filter and history guards
        (C2/C3).
      summary: Retrieve my category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Category id.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      description: PATCH only. Type change is blocked while transactions reference
        the category.
      summary: Partially update my category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Category id.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      description: 204 when unreferenced; 400 `category_in_use` when transactions
        reference the category. Referenced categories are never cascade-deleted.
      summary: Delete my category
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Category id.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/notes/:
    get:
      operationId: notes_list
      description: Owner-scoped, ordered by (-updated_at, -id).
      summary: List my notes
      tags:
      - notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
          description: ''
    post:
      operationId: notes_create
      description: Owner set from the JWT. 201 on success.
      summary: Create a note
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Note'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Note'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Note'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
  /api/notes/{id}/:
    get:
      operationId: notes_retrieve
      description: User-owned standalone note CRUD.
      summary: Retrieve my note
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Note id.
        required: true
      tags:
      - notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
    patch:
      operationId: notes_partial_update
      description: PATCH only.
      summary: Partially update my note
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Note id.
        required: true
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNote'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNote'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNote'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
    delete:
      operationId: notes_destroy
      description: 204 on success.
      summary: Delete my note
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Note id.
        required: true
      tags:
      - notes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/reports/budget-status/:
    get:
      operationId: reports_budget_status_list
      description: Limit/spent/remaining/is_over for each of the month's budgets (all
        scopes). Empty budget list returns `[]`. Reuses the budgets spend formula.
      summary: Budget status
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: Calendar month `YYYY-MM`; inclusive calendar-date bounds.
        required: true
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetStatusRow'
          description: ''
  /api/reports/category-breakdown/:
    get:
      operationId: reports_category_breakdown_list
      description: Per-category totals for the month and type in one GROUP BY (no
        per-category queries), ordered by total descending, then category name.
      summary: Category breakdown
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: Calendar month `YYYY-MM`; inclusive calendar-date bounds.
        required: true
      - in: query
        name: type
        schema:
          type: string
          enum:
          - expense
          - income
        description: Transaction type to group by.
        required: true
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryBreakdownEntry'
          description: ''
  /api/reports/monthly-summary/:
    get:
      operationId: reports_monthly_summary_retrieve
      description: Total income, expenses and net for the month. Empty months return
        zeros, never errors.
      summary: Monthly summary
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: Calendar month `YYYY-MM`; inclusive calendar-date bounds.
        required: true
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlySummary'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/transactions/:
    get:
      operationId: transactions_list
      description: Owner-scoped, ordered by (-date, -id), paginated (page size 20).
        Filters combine.
      summary: List my transactions
      parameters:
      - in: query
        name: category_id
        schema:
          type: integer
        description: Filter by own category id.
      - in: query
        name: end_date
        schema:
          type: string
        description: ISO date YYYY-MM-DD (inclusive).
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: start_date
        schema:
          type: string
        description: ISO date YYYY-MM-DD (inclusive).
      - in: query
        name: type
        schema:
          type: string
          enum:
          - expense
          - income
      tags:
      - transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionList'
          description: ''
    post:
      operationId: transactions_create
      description: Owner set from the JWT. Category must be owned and type-matched.
      summary: Create a transaction
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Transaction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Transaction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
  /api/transactions/{id}/:
    get:
      operationId: transactions_retrieve
      description: User-owned transaction CRUD with combined filters (T2/T3).
      summary: Retrieve my transaction
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Transaction id.
        required: true
      tags:
      - transactions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    patch:
      operationId: transactions_partial_update
      description: PATCH only. Category ownership and category/transaction type match
        are re-validated jointly on partial input.
      summary: Partially update my transaction
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Transaction id.
        required: true
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTransaction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTransaction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTransaction'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
          description: ''
    delete:
      operationId: transactions_destroy
      description: User-owned transaction CRUD with combined filters (T2/T3).
      summary: Delete my transaction
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Transaction id.
        required: true
      tags:
      - transactions
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    AccessResponse:
      type: object
      description: Access-token-only response body (refresh travels via httpOnly cookie).
      properties:
        access:
          type: string
      required:
      - access
    Budget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
          nullable: true
        month:
          type: string
          format: date
        limit_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        spent:
          type: string
          readOnly: true
          description: Derived from expense transactions.
        remaining:
          type: string
          readOnly: true
          description: limit_amount - spent.
        is_over:
          type: boolean
          readOnly: true
          description: True when spent exceeds the limit.
      required:
      - id
      - is_over
      - limit_amount
      - month
      - remaining
      - spent
    BudgetStatusRow:
      type: object
      description: Response shape preview for OpenAPI only (not used for I/O).
      properties:
        budget_id:
          type: integer
        category_id:
          type: integer
          nullable: true
        limit:
          type: string
          description: 2dp decimal string.
        spent:
          type: string
          description: 2dp decimal string.
        remaining:
          type: string
          description: 2dp decimal string.
        is_over:
          type: boolean
      required:
      - budget_id
      - category_id
      - is_over
      - limit
      - remaining
      - spent
    Category:
      type: object
      description: |-
        Validate + serialize user-owned categories (docs/specs/categories/02-crud-api.md).

        `owner` is never in the payload; the view sets it server-side from
        `request.user`. Duplicate checks are case-insensitive per (owner, type).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - type
      - updated_at
    CategoryBreakdownEntry:
      type: object
      description: Response shape preview for OpenAPI only (not used for I/O).
      properties:
        category_id:
          type: integer
          nullable: true
        category_name:
          type: string
        total:
          type: string
          description: 2dp decimal string.
      required:
      - category_id
      - category_name
      - total
    EmailTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          format: email
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    MonthlySummary:
      type: object
      description: Response shape preview for OpenAPI only (not used for I/O).
      properties:
        month:
          type: string
          description: Requested month as `YYYY-MM`.
        total_income:
          type: string
          description: 2dp decimal string.
        total_expenses:
          type: string
          description: 2dp decimal string.
        net_balance:
          type: string
          description: income − expenses, 2dp string.
      required:
      - month
      - net_balance
      - total_expenses
      - total_income
    Note:
      type: object
      description: |-
        Validate + serialize user-owned standalone notes.

        `owner` is never in the payload; the view sets it server-side from
        `request.user`.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - title
      - updated_at
    PaginatedTransactionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
    PatchedBudget:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
          nullable: true
        month:
          type: string
          format: date
        limit_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        spent:
          type: string
          readOnly: true
          description: Derived from expense transactions.
        remaining:
          type: string
          readOnly: true
          description: limit_amount - spent.
        is_over:
          type: boolean
          readOnly: true
          description: True when spent exceeds the limit.
    PatchedCategory:
      type: object
      description: |-
        Validate + serialize user-owned categories (docs/specs/categories/02-crud-api.md).

        `owner` is never in the payload; the view sets it server-side from
        `request.user`. Duplicate checks are case-insensitive per (owner, type).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        type:
          $ref: '#/components/schemas/TypeEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedNote:
      type: object
      description: |-
        Validate + serialize user-owned standalone notes.

        `owner` is never in the payload; the view sets it server-side from
        `request.user`.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTransaction:
      type: object
      description: |-
        Money-row validation (docs/specs/transactions/02 + 03).

        - `amount` positive Decimal(12,2), serialized as a string.
        - `category` must exist AND belong to `request.user` AND match `type`
          (both foreign and absent ids return the same 400 — no existence leak).
        - Client-sent `user`/`owner` keys are ignored: owner is set by the view.
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        type:
          $ref: '#/components/schemas/TypeEnum'
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
          maxLength: 128
      required:
      - email
      - id
      - password
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Transaction:
      type: object
      description: |-
        Money-row validation (docs/specs/transactions/02 + 03).

        - `amount` positive Decimal(12,2), serialized as a string.
        - `category` must exist AND belong to `request.user` AND match `type`
          (both foreign and absent ids return the same 400 — no existence leak).
        - Client-sent `user`/`owner` keys are ignored: owner is set by the view.
      properties:
        id:
          type: integer
          readOnly: true
        category:
          type: integer
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        type:
          $ref: '#/components/schemas/TypeEnum'
        date:
          type: string
          format: date
        description:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - category
      - created_at
      - date
      - id
      - type
      - updated_at
    TypeEnum:
      enum:
      - income
      - expense
      type: string
      description: |-
        * `income` - income
        * `expense` - expense
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - id
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
